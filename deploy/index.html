*{box-sizing:border-box}
html,body{min-height:100%}
.pal-wrap{position:relative; display:inline-flex}
.pal-pop{position:absolute; right:0; top:calc(100% + 8px); z-index:45; min-width:210px; display:flex; flex-direction:column; gap:2px; padding:8px; border-radius:12px; background:var(--surface-solid); border:1px solid var(--border-strong); box-shadow:var(--shadow); animation:pop .15s ease}
.pal-pop.left{right:auto; left:0}
.pal-pop .pal-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); padding:4px 8px 6px}
.pal-pop button{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:0; border-radius:8px; background:none; color:var(--fg); cursor:pointer; text-align:left; font-size:.9rem}
.pal-pop button:hover{background:var(--surface-2)}
.pal-pop button.on{background:var(--accent-soft)}
.pal-pop button .ic{margin-left:auto; color:var(--accent)}
.swatch{flex:none; width:22px; height:22px; border-radius:7px}
.pal-pop .seg{display:flex; flex-wrap:nowrap; width:100%}
.pal-pop .seg button{flex:1; width:auto; justify-content:center; padding:6px 10px}
body{
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 85% -10%,var(--glow-2),transparent 60%),radial-gradient(800px 500px at -10% 10%,var(--glow-1),transparent 60%);
  background-attachment:fixed;
  color:var(--fg); font-family:var(--f-body); font-size:14.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1.06rem} h4{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:.85rem}
.ic{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:252px minmax(0,1fr); min-height:100vh}
.sidebar{
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:20px;
  padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));
  background:var(--surface); border-right:1px solid var(--border); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  z-index:30;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.brand-mark{width:34px; height:34px; border-radius:10px; background:var(--grad); display:grid; place-items:center; color:#fff; font-family:var(--f-display); font-weight:700; font-size:15px; box-shadow:0 6px 18px var(--btn-glow)}
.brand-name{font-family:var(--f-display); font-weight:700; font-size:1.15rem; letter-spacing:-.01em}
.brand-name span{color:var(--accent)}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-label{font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); padding:0 10px 6px}
.nav button{display:flex; align-items:center; gap:11px; width:100%; padding:9px 10px; border:0; border-radius:var(--r-sm); background:none; color:var(--muted); cursor:pointer; text-align:left; font-weight:500}
.nav button:hover{background:var(--surface-2); color:var(--fg)}
.nav button.on{background:var(--accent-soft); color:var(--fg)}
.nav button.on .ic{color:var(--accent)}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.me{display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--r-sm); background:var(--surface-2)}
.me-name{font-weight:600; font-size:.9rem; line-height:1.2}
.me-role{font-size:.75rem; color:var(--muted)}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:12px;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--border);
}
.topbar .crumb{font-size:.85rem; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.topbar .grow{flex:1}
.menu-btn{display:none}
.page{
  width:100%; max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:22px;
  padding-block:26px 48px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
@media (min-width:900px){ .page{padding-left:32px; padding-right:32px} .topbar{padding-left:32px; padding-right:32px} }
.page-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px}
.page-head p{color:var(--muted); margin-top:4px}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.scrim{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:270px; height:auto; transform:translateX(-105%); transition:transform .22s ease; background:var(--surface-solid); padding-top:max(22px,env(safe-area-inset-top,0px))}
  .shell.nav-open .sidebar{transform:none; box-shadow:var(--shadow)}
  .shell.nav-open .scrim{display:block; position:fixed; inset:0; background:rgba(5,6,20,.5); z-index:25}
  .menu-btn{display:inline-grid}
}

/* ---------- surfaces ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); min-width:0}
.card-pad{padding:20px}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border); flex-wrap:wrap}
.card-head p{color:var(--muted); font-size:.85rem}
.card-body{padding:18px 20px}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:980px){ .g3{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){ .g2,.g3{grid-template-columns:minmax(0,1fr)} }

.tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
@media (max-width:980px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.tile{padding:16px 18px; display:flex; flex-direction:column; gap:6px}
.tile-label{font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:7px}
.tile-label .ic{color:var(--accent)}
.tile-value{font-family:var(--f-display); font-size:1.85rem; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.tile-sub{font-size:.8rem; color:var(--faint)}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 15px; border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--fg); font-weight:500; cursor:pointer; white-space:nowrap; transition:background .15s, transform .15s, box-shadow .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 6px 18px var(--btn-glow)}
.btn.primary:hover{box-shadow:0 8px 26px var(--btn-glow); filter:brightness(1.08)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2); color:var(--fg)}
.btn.danger{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.btn.ok{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.btn.sm{padding:6px 10px; font-size:.83rem; gap:6px}
.btn.lg{padding:12px 20px; font-size:1rem}
.btn.block{width:100%}
.icon-btn{display:inline-grid; place-items:center; width:36px; height:36px; border-radius:var(--r-sm); border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer}
.icon-btn:hover{background:var(--surface-2); color:var(--fg)}
.icon-btn.danger:hover{color:var(--bad); background:var(--bad-soft)}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field-label{font-size:.82rem; font-weight:500; color:var(--muted)}
.field-hint{font-size:.78rem; color:var(--faint)}
.field-err{font-size:.78rem; color:var(--bad)}
.input,.select,.textarea{width:100%; padding:10px 12px; border-radius:var(--r-sm); border:1px solid var(--border-strong); background:var(--surface-2); color:var(--fg); outline:none; transition:border-color .15s, box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.select option{background:var(--surface-solid); color:var(--fg)}
.textarea{min-height:92px; resize:vertical; line-height:1.5}
.input.code{font-family:var(--f-mono); letter-spacing:.08em; text-transform:uppercase}
.search{position:relative; min-width:0}
.search .ic{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint)}
.search .input{padding-left:36px}
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.form-grid .span2{grid-column:1 / -1}
@media (max-width:640px){ .form-grid{grid-template-columns:minmax(0,1fr)} }
.seg{display:inline-flex; flex-wrap:wrap; padding:3px; gap:3px; border-radius:var(--r-sm); background:var(--surface-2); border:1px solid var(--border)}
.seg button{border:0; background:none; padding:6px 12px; border-radius:8px; color:var(--muted); cursor:pointer; font-weight:500; font-size:.86rem}
.seg button.on{background:var(--surface-solid); color:var(--fg); box-shadow:var(--shadow-sm)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 14px; border-radius:var(--r-sm); background:var(--surface-2); cursor:pointer}
.switch input{position:absolute; opacity:0; pointer-events:none}
.switch .track{flex:none; width:40px; height:23px; border-radius:20px; background:var(--surface-3); position:relative; transition:background .15s}
.switch .track::after{content:""; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:#fff; transition:transform .18s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(17px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent); outline-offset:2px}
.switch-text b{display:block; font-weight:500; font-size:.9rem}
.switch-text span{font-size:.78rem; color:var(--muted)}
.radio-cards{display:grid; gap:8px}
.radio-card{display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:var(--r-sm); border:1px solid var(--border); cursor:pointer}
.radio-card.on{border-color:var(--accent); background:var(--accent-soft)}
.radio-card input{margin-top:3px; accent-color:var(--accent)}
.radio-card b{display:block; font-weight:500; font-size:.9rem}
.radio-card span{font-size:.78rem; color:var(--muted)}

/* ---------- pills / misc ---------- */
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:20px; font-size:.75rem; font-weight:500; white-space:nowrap; background:var(--surface-2); color:var(--muted)}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9}
.pill.plain::before{display:none}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.code-chip{display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:var(--f-mono); font-size:.8rem; font-weight:600; letter-spacing:.06em; padding:4px 6px 4px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent); border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.code-chip button{border:0; background:none; color:inherit; cursor:pointer; padding:2px; display:grid; border-radius:5px}
.code-chip button:hover{background:var(--accent-soft)}
.avatar{flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:.78rem; font-weight:600; color:#fff; background:var(--grad); overflow:hidden}
.avatar img{width:100%; height:100%; object-fit:cover}
.avatar.lg{width:84px; height:84px; font-size:1.6rem}
.subj-ic{flex:none; width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:.95rem; color:#fff}
.empty{padding:36px 20px; text-align:center; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:10px}
.empty .ic{color:var(--faint)}
.banner{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:var(--r-sm); font-size:.88rem}
.banner.warn{background:var(--warn-soft); color:var(--warn)}
.banner.info{background:var(--accent-soft); color:var(--fg)}
.banner.info .ic{color:var(--accent)}
.banner.bad{background:var(--bad-soft); color:var(--bad)}
.divider{height:1px; background:var(--border); border:0; margin:0}
.kv{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0; font-weight:500; text-align:right}
.bar{height:6px; border-radius:6px; background:var(--surface-3); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:6px; background:var(--grad)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:.88rem}
.tbl th{text-align:left; font-weight:500; font-size:.74rem; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); padding:11px 16px; border-bottom:1px solid var(--border); white-space:nowrap}
.tbl td{padding:12px 16px; border-bottom:1px solid var(--border); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl tr.is-me td{background:var(--accent-soft)}
.tbl.compact th{padding:9px 14px}
.tbl.compact td{padding:7px 14px}
.tbl.compact .avatar{width:28px; height:28px; font-size:.7rem}
.tbl.compact .rank{width:24px; height:24px; font-size:.75rem}
.who{display:flex; align-items:center; gap:10px; min-width:0}
.who b{font-weight:500; display:block; white-space:nowrap}
.who span{font-size:.78rem; color:var(--muted)}
.rank{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; font-weight:600; font-size:.8rem; background:var(--surface-2)}
.rank.r1{background:linear-gradient(135deg,#f7d774,#e0a930); color:#3a2a00}
.rank.r2{background:linear-gradient(135deg,#e4e8f2,#aab2c6); color:#262b3a}
.rank.r3{background:linear-gradient(135deg,#f0b98a,#c97a43); color:#3a1d06}
.pager{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap; font-size:.85rem; color:var(--muted)}
.filters{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border)}
.filters .search{flex:1 1 220px}
.filters .select{width:auto; min-width:150px}

/* ---------- charts ---------- */
.bars{display:flex; align-items:flex-end; gap:12px; height:190px; padding:8px 4px 0; background-image:linear-gradient(var(--border) 1px,transparent 1px); background-size:100% 25%; background-position:0 0}
.bars .b{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; height:100%; min-width:0}
.bars .b i{display:block; width:100%; max-width:46px; border-radius:7px 7px 3px 3px; background:var(--grad); min-height:3px; transition:height .5s ease}
.bars .b span{font-size:.75rem; font-weight:600; font-variant-numeric:tabular-nums}
.bars-x{display:flex; gap:12px; padding:8px 4px 0}
.bars.dense,.bars-x.dense{gap:3px}
.bars.dense .b i{border-radius:4px 4px 2px 2px}
.bars-x.dense span{font-size:.62rem; text-overflow:clip}
.bars-x span{flex:1; text-align:center; font-size:.74rem; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.line-chart{position:relative; height:180px}
.line-chart svg{width:100%; height:100%; display:block; overflow:visible}
.line-chart .dot{position:absolute; width:11px; height:11px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); transform:translate(-50%,-50%)}
.line-chart .dot-label{position:absolute; transform:translate(-50%,-160%); font-size:.75rem; font-weight:600; background:var(--surface-solid); padding:2px 7px; border-radius:6px; border:1px solid var(--border); white-space:nowrap}
.line-x{display:flex; justify-content:space-between; font-size:.74rem; color:var(--muted); padding-top:8px}
.donut-wrap{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
.donut{width:150px; height:150px; flex:none; position:relative}
.donut svg{width:100%; height:100%; transform:rotate(-90deg)}
.donut .center{position:absolute; inset:0; display:grid; place-items:center; text-align:center}
.donut .center b{font-family:var(--f-display); font-size:1.7rem; font-weight:600; display:block; line-height:1}
.donut .center span{font-size:.75rem; color:var(--muted)}
.legend{display:flex; flex-direction:column; gap:9px; font-size:.86rem; min-width:0}
.legend div{display:flex; align-items:center; gap:9px}
.legend i{width:10px; height:10px; border-radius:3px; flex:none}
.legend b{margin-left:auto; padding-left:14px; font-variant-numeric:tabular-nums}

/* ---------- modal / toast ---------- */
.modal-back{position:fixed; inset:0; z-index:60; background:rgba(5,6,22,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:grid; place-items:center; padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); animation:fade .15s ease}
.modal{width:100%; max-width:520px; max-height:calc(100vh - 32px); display:flex; flex-direction:column; background:var(--surface-solid); border:1px solid var(--border-strong); border-radius:18px; box-shadow:var(--shadow); animation:pop .18s ease}
.modal.wide{max-width:820px}
.modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px 14px 22px; border-bottom:1px solid var(--border)}
.modal-body{padding:20px 22px; overflow:auto; display:flex; flex-direction:column; gap:16px}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 22px; border-top:1px solid var(--border); flex-wrap:wrap}
.toasts{position:fixed; right:max(16px,env(safe-area-inset-right,0px)); bottom:max(16px,env(safe-area-inset-bottom,0px)); z-index:80; display:flex; flex-direction:column; gap:8px; max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex; gap:10px; align-items:center; padding:12px 14px; border-radius:12px; background:var(--surface-solid); border:1px solid var(--border-strong); box-shadow:var(--shadow); font-size:.9rem; animation:pop .18s ease}
.toast .ic{color:var(--ok)} .toast.warn .ic{color:var(--warn)} .toast.bad .ic{color:var(--bad)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98)}}

/* ---------- auth ---------- */
.auth{min-height:100vh; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{position:relative; padding:44px max(32px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; justify-content:space-between; gap:32px; border-right:1px solid var(--border); overflow-x:clip}
.auth-brand h1{font-size:clamp(2rem,3.4vw,2.9rem); line-height:1.08; max-width:14ch}
.auth-brand h1 em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.auth-brand .lead{color:var(--muted); max-width:46ch; margin-top:14px; font-size:1rem}
.preview-card{max-width:440px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); transform:rotate(-1.2deg)}
.preview-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.timer-chip{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-weight:600; font-size:.85rem; padding:4px 10px; border-radius:8px; background:var(--warn-soft); color:var(--warn)}
.auth-side{display:flex; align-items:center; justify-content:center; padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.auth-form{width:100%; max-width:410px; padding:28px; display:flex; flex-direction:column; gap:16px}
.demo-list{display:grid; gap:8px}
.demo-btn{display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--surface-2); cursor:pointer; text-align:left}
.demo-btn:hover{border-color:var(--accent)}
.demo-btn b{display:block; font-weight:500; font-size:.9rem}
.demo-btn b + span{display:block; font-size:.78rem; color:var(--muted); font-family:var(--f-mono)}
.or{display:flex; align-items:center; gap:10px; font-size:.78rem; color:var(--faint)}
.or::before,.or::after{content:""; flex:1; height:1px; background:var(--border)}
@media (max-width:899px){ .auth{grid-template-columns:minmax(0,1fr)} .auth-brand{border-right:0; border-bottom:1px solid var(--border); padding:28px max(16px,env(safe-area-inset-left,0px)) 28px} .preview-card{display:none} }

/* ---------- tests ---------- */
.test-card{display:flex; flex-direction:column; gap:14px; padding:18px}
.test-card-top{display:flex; gap:12px; align-items:flex-start}
.test-card h3{font-size:1.02rem}
.meta{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.8rem; color:var(--muted)}
.meta span{display:inline-flex; align-items:center; gap:5px}
.test-card-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; flex-wrap:wrap}
.code-entry{display:flex; gap:10px; flex-wrap:wrap}
.code-entry .input{flex:1 1 180px; font-size:1.05rem; padding:12px 14px}
.hero-code{padding:22px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:20px; align-items:center; background:var(--grad-soft),var(--surface)}
@media (max-width:760px){ .hero-code{grid-template-columns:minmax(0,1fr)} }
.q-item{display:flex; gap:14px; padding:16px 18px; border-bottom:1px solid var(--border)}
.q-item:last-child{border-bottom:0}
.q-num{flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-weight:600; font-size:.85rem; background:var(--accent-soft); color:var(--accent)}
.q-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
.q-text{font-size:.95rem}
.q-choices{display:flex; flex-wrap:wrap; gap:6px}
.q-choice{font-size:.82rem; padding:4px 10px; border-radius:8px; background:var(--surface-2); color:var(--muted)}
.q-choice.right{background:var(--ok-soft); color:var(--ok)}
.q-tools{display:flex; gap:2px; align-items:flex-start}
.q-img{max-width:min(360px,100%); max-height:220px; border-radius:10px; border:1px solid var(--border); object-fit:contain; background:var(--surface-2)}
.choice-row{display:flex; gap:8px; align-items:center}
.choice-row .mark{flex:none; width:22px; height:22px; accent-color:var(--ok); cursor:pointer}
.preview-box{padding:12px 14px; border-radius:var(--r-sm); background:var(--surface-2); border:1px dashed var(--border-strong); font-size:.95rem}
.math-text{overflow-wrap:anywhere}
.math{display:inline-block; vertical-align:middle; max-width:100%; overflow-x:auto}
.math math{font-size:1.1em}
.drop{display:flex; flex-direction:column; align-items:center; gap:8px; padding:22px; border-radius:var(--r-sm); border:1.5px dashed var(--border-strong); color:var(--muted); text-align:center; cursor:pointer}
.drop:hover{border-color:var(--accent); color:var(--fg)}
.template{font-size:.8rem}
.template td,.template th{padding:6px 10px}

/* ---------- take test ---------- */
.take{min-height:100vh; display:flex; flex-direction:column; -webkit-user-select:none; user-select:none}
.take input,.take textarea{-webkit-user-select:text; user-select:text}
.fs-gate{position:fixed; inset:0; z-index:55; background:var(--bg); display:grid; place-items:center; text-align:center; padding:24px}
.fs-gate div{display:flex; flex-direction:column; align-items:center; gap:14px; max-width:420px}
.fs-gate b{font-family:var(--f-display); font-size:1.35rem}
.fs-gate span{color:var(--muted)}
.fs-gate .ic{color:var(--accent)}
.take-bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); background:color-mix(in srgb,var(--bg) 82%,transparent); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border-bottom:1px solid var(--border)}
.take-title{flex:1 1 200px; min-width:0}
.take-title b{display:block; font-family:var(--f-display); font-size:1.02rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.take-title span{font-size:.78rem; color:var(--muted)}
.timer{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-mono); font-size:1.25rem; font-weight:600; padding:7px 14px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad-soft); color:var(--bad); border-color:transparent; animation:pulse 1s ease-in-out infinite}
.timer.mid{background:var(--warn-soft); color:var(--warn); border-color:transparent}
@keyframes pulse{50%{opacity:.6}}
.saved{font-size:.78rem; color:var(--muted); display:inline-flex; align-items:center; gap:5px}
.saved .ic{color:var(--ok)}
.take-body{width:100%; max-width:1180px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px; padding-block:24px 48px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:900px){ .take-body{grid-template-columns:minmax(0,1fr)} }
.question{padding:24px; display:flex; flex-direction:column; gap:18px}
.question-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center}
.question-text{font-size:1.15rem; line-height:1.55}
.options{display:flex; flex-direction:column; gap:10px}
.option{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; text-align:left; width:100%; transition:border-color .12s, background .12s}
.option:hover{border-color:var(--border-strong)}
.option.on{border-color:var(--accent); background:var(--accent-soft)}
.option .key{flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-weight:600; font-size:.85rem; background:var(--surface-3); color:var(--muted)}
.option.on .key{background:var(--accent); color:var(--accent-fg)}
.option.multi .key{border-radius:7px}
.option-text{flex:1; min-width:0; font-size:1rem}
.option.right{border-color:var(--ok); background:var(--ok-soft)}

const normAns = s => String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g,' ').replace(/ё/g,'е').replace(/(\d),(\d)/g,'$1.$2').replace(/[.!]+$/,'');

/* Urinishni baholash: ko'p javobli savolda to'liq mos kelsagina ball beriladi */
function grade(attempt, qmap){
  let score = 0, max = 0, correct = 0; const per = {};
  attempt.order.forEach(qid => {
    const q = qmap[qid]; if(!q) return;
    max += q.points;
    const sel = attempt.answers[qid] || [];
    let right, ok;
    if(isWritten(q)){ right = q.answers || []; ok = !!normAns(sel[0]) && right.some(x => normAns(x) === normAns(sel[0])); }
    else { right = q.choices.filter(c => c.is_correct).map(c => c.id); ok = sel.length === right.length && sel.every(id => right.includes(id)); }
    if(ok){ score += q.points; correct++; }
    per[qid] = { ok, earned: ok ? q.points : 0, sel, right };
  });
  score = Math.round(score*10)/10; max = Math.round(max*10)/10;
  return { score, max_score:max, correct_answers:correct, total_questions:attempt.order.length,
           percentage: max ? Math.round(score/max*1000)/10 : 0, per };
}
const qmapOf = db => Object.fromEntries(db.questions.map(q => [q.id, q]));

/* Test reytingi: har o'quvchining eng yaxshi urinishi (foiz ↓, vaqt ↑) */
function leaderboard(db, testId){
  const best = {};
  db.attempts.filter(a => a.test_id === testId && a.is_completed).forEach(a => {
    const b = best[a.student_id];
    if(!b || a.percentage > b.percentage || (a.percentage === b.percentage && spentSec(a) < spentSec(b))) best[a.student_id] = a;
  });
  return Object.values(best).sort((a,b) => b.percentage - a.percentage || spentSec(a) - spentSec(b));
}

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function mkQ(id, test_id, bank_id, type, text, opts, points, difficulty, order){
  if(type === 'written') return { id, test_id, bank_id, question_type:type, text, image:null, difficulty:difficulty||'medium', points:points||1, order:order||0, choices:[], answers:opts };

}

/* Demo savollar generatori: fan bo'yicha variantli va yozma savollar (har bir test uchun turli, deterministik) */
const POOL = {
  verbs: [['go','went','gone'],['take','took','taken'],['see','saw','seen'],['write','wrote','written'],['eat','ate','eaten'],['give','gave','given'],['speak','spoke','spoken'],['buy','bought','bought'],['bring','brought','brought'],['drink','drank','drunk'],['begin','began','begun'],['choose','chose','chosen'],['forget','forgot','forgotten'],['know','knew','known'],['drive','drove','driven'],['fly','flew','flown'],['swim','swam','swum'],['sing','sang','sung'],['break','broke','broken'],['wear','wore','worn'],['teach','taught','taught'],['think','thought','thought'],['catch','caught','caught'],['find','found','found'],['leave','left','left'],['make','made','made'],['run','ran','run'],['come','came','come'],['steal','stole','stolen'],['ride','rode','ridden']],
  en: [['kitob','book'],['olma','apple'],['uy','house'],['maktab','school'],["do'st",'friend'],['suv','water'],['it','dog'],['mushuk','cat'],['qalam','pen'],['oy','moon'],['quyosh','sun'],['daraxt','tree'],['shahar','city'],['non','bread'],['deraza','window'],['eshik','door'],['stol','table'],['gul','flower']],
  ant: [['высокий','низкий'],['день','ночь'],['начало','конец'],['тёплый','холодный'],['большой','маленький'],['лёгкий','тяжёлый'],['быстрый','медленный'],['старый','новый'],['добрый','злой'],['весёлый','грустный'],['громкий','тихий'],['сухой','мокрый'],['богатый','бедный'],['правда','ложь'],['друг','враг'],['вверх','вниз'],['открыть','закрыть'],['сильный','слабый'],['широкий','узкий'],['светлый','тёмный']],

  ru: [['kitob','книга'],['uy','дом'],['suv','вода'],['maktab','школа'],['ona','мать'],['ota','отец'],['olma','яблоко'],['non','хлеб'],['shahar','город'],['daraxt','дерево'],['qalam','ручка'],['gul','цветок']]
};
function fillQuestions(subjectId, needClosed, needWritten, rnd, baseId){
  const pick = arr => arr[Math.floor(rnd()*arr.length)];
  const mix = arr => { arr = arr.slice(); for(let i = arr.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; };
  const ri = (a, b) => a + Math.floor(rnd()*(b-a+1));
  const choice = (correct, wrongs) => { const w = [...new Set(wrongs.map(String))].filter(x => x !== String(correct)).slice(0, 3); return mix([[String(correct), 1], ...w.map(x => [x])]); };
  const closed = [], written = [], seen = new Set();
  const push = (list, def) => { if(seen.has(def[1])) return; seen.add(def[1]); list.push(def); };
  let guard = 0;
  while((closed.length < needClosed || written.length < needWritten) && guard++ < 3000){
    const wantC = closed.length < needClosed, wantW = written.length < needWritten;
    if(subjectId === 1){ // Matematika
      const k = ri(0, 4);
      if(wantC && (k < 2 || !wantW)){
        const kind = ri(0, 3);
        if(kind === 0){ const a = ri(6,19), b = ri(3,12); push(closed, ['single', `$${a} \\cdot ${b}$ ni hisoblang.`, choice(a*b, [a*b+a, a*b-b, a*b+10, a*b-1]), 1, 'easy']); }
        else if(kind === 1){ const x = ri(2,15), a = ri(2,9), b = ri(1,20); push(closed, ['single', `$${a}x + ${b} = ${a*x+b}$ bo'lsa, $x$ nechaga teng?`, choice(x, [x+1, x-1, x+2, x*2]), 1, 'medium']); }
        else if(kind === 2){ const n = ri(2,20)*20, p = pick([5,10,15,20,25,30,50]), v = n*p/100; push(closed, ['single', `$${n}$ ning $${p}\\%$ i nechaga teng?`, choice(v, [v*2, v+5, v/2, v+10]), 1, 'medium']); }
        else { const m = ri(11,25); push(closed, ['single', `$${m}^2$ nechaga teng?`, choice(m*m, [m*m+m, m*m-1, m*2, m*m+10]), 1, 'easy']); }
      } else if(wantW){
        const kind = ri(0, 3);
        if(kind === 0){ const x = ri(2,14), a = ri(2,8), b = ri(1,15); push(written, ['written', `$${a}x - ${b} = ${a*x-b}$ tenglamani yeching. $x$ ning qiymatini yozing.`, [String(x)], 2, 'medium']); }
        else if(kind === 1){ const m = ri(12,30); push(written, ['written', `$\\sqrt{${m*m}}$ ni hisoblang.`, [String(m)], 2, 'easy']); }
        else if(kind === 2){ const n = ri(3,30)*10, p = pick([10,20,30,40,60,75]); push(written, ['written', `$${n}$ sonining $${p}\\%$ ini toping.`, [String(n*p/100)], 2, 'medium']); }
        else { const a1 = ri(1,9), d = ri(2,7), n = ri(8,15); push(written, ['written', `Arifmetik progressiya: $${a1}, ${a1+d}, ${a1+2*d}, \\ldots$ Uning ${n}-hadini toping.`, [String(a1+(n-1)*d)], 2, 'hard']); }
      }
    } else if(subjectId === 3){ // Ingliz tili
      const v = pick(POOL.verbs), t = pick(POOL.en), others = POOL.verbs.filter(x => x !== v);
      if(wantC && (rnd() < .6 || !wantW)){
        const kind = ri(0, 2);
        if(kind === 0) push(closed, ['single', `What is the past participle (V3) of «${v[0]}»?`, choice(v[2], [v[1], v[0]+'ed', pick(others)[2], pick(others)[2]]), 1, 'medium']);
        else if(kind === 1) push(closed, ['single', `Choose the past simple (V2) of «${v[0]}».`, choice(v[1], [v[2], v[0]+'ed', pick(others)[1], pick(others)[1]]), 1, 'easy']);
        else push(closed, ['single', `«${t[0]}» so'zining inglizcha tarjimasi:`, choice(t[1], mix(POOL.en.filter(x => x !== t)).slice(0,4).map(x => x[1])), 1, 'easy']);
      } else if(wantW){
        const kind = ri(0, 2);
        if(kind === 0) push(written, ['written', `Write the past simple (V2) of «${v[0]}».`, [v[1]], 2, 'medium']);
        else if(kind === 1) push(written, ['written', `Write the past participle (V3) of «${v[0]}».`, [v[2]], 2, 'medium']);
        else push(written, ['written', `«${t[0]}» so'zini ingliz tiliga tarjima qiling.`, [t[1]], 2, 'easy']);
      }
    } else { // Rus tili
      const an = pick(POOL.ant), pl = pick(POOL.plur), tr = pick(POOL.ru);
      if(wantC && (rnd() < .6 || !wantW)){
        const kind = ri(0, 2);
        if(kind === 0) push(closed, ['single', `Антоним к слову «${an[0]}»:`, choice(an[1], mix(POOL.ant.filter(x => x !== an)).slice(0,4).map(x => x[1])), 1, 'easy']);
        else if(kind === 1) push(closed, ['single', `Множественное число слова «${pl[0]}»:`, choice(pl[1], [pl[0]+'и', pl[0]+'ы', pl[0]+'а', pl[0]+'ов']), 1, 'medium']);
        else push(closed, ['single', `«${tr[0]}» so'zining ruscha tarjimasi:`, choice(tr[1], mix(POOL.ru.filter(x => x !== tr)).slice(0,4).map(x => x[1])), 1, 'easy']);
      } else if(wantW){
        const kind = ri(0, 2);
        if(kind === 0) push(written, ['written', `Напишите антоним к слову «${an[0]}».`, [an[1]], 2, 'medium']);
        else if(kind === 1) push(written, ['written', `Напишите множественное число слова «${pl[0]}».`, [pl[1]], 2, 'medium']);
        else push(written, ['written', `«${tr[0]}» so'zini rus tiliga tarjima qiling.`, [tr[1]], 2, 'easy']);
      }
    }
  }
  return [...closed, ...written].map((d, i) => [baseId + i + 1, ...d]);
}

          if(isWritten(q)){ answers[q.id] = [r() < sk - .08 ? q.answers[0] : (r() < .5 ? '' : 'bilmayman')]; return; }
          const right = q.choices.filter(c => c.is_correct).map(c => c.id);
          if(r() < sk) answers[q.id] = right;
          else {
            const wrong = q.choices.filter(c => !c.is_correct).map(c => c.id);
            if(q.question_type === 'multiple') answers[q.id] = [right[0], wrong[Math.floor(r()*wrong.length)]];
            else answers[q.id] = [wrong[Math.floor(r()*wrong.length)]];
          }
        });

        const started = new Date(now - day*86400000 + (k-1)*3600000);
        const spent = test.duration_minutes*60*(.35 + r()*.55);

          tab_switches: r() < .22 ? 1 + Math.floor(r()*3) : 0, order, choice_order:{}, answers };
        const g = grade(a, qmap); delete g.per;
        attempts.push(Object.assign(a, g));
      }
    });
  });
  return { version:5, users, subjects, banks, tests, questions:Q, attempts };
}

function Icon({ n, s }){

function texToHtml(tex){
  try{ if(window.katex) return katex.renderToString(tex, { output:'mathml', throwOnError:false }); }catch(e){}
  return tex.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
/* MathRenderer: $...$ ichidagi LaTeX'ni KaTeX bilan chizadi */
function MathText({ text }){
  const parts = useMemo(() => {
    const s = text || '', out = [], re = /\$([^$]+)\$/g; let last = 0, m;
    while((m = re.exec(s))){ if(m.index > last) out.push(s.slice(last, m.index)); out.push({ tex:m[1] }); last = re.lastIndex; }
    if(last < s.length) out.push(s.slice(last));
    return out;
  }, [text]);
  return html`<span className="math-text">${parts.map((p,i) => typeof p === 'string' ? p : html`<span key=${i} className="math" dangerouslySetInnerHTML=${{ __html: texToHtml(p.tex) }}></span>`)}</span>`;
}

function Pill({ tone, plain, children }){ return html`<span className=${'pill ' + (tone||'') + (plain ? ' plain' : '')}>${children}</span>`; }

function CodeChip({ code }){
  const { toast } = useApp();
  const copy = () => {

    try{ navigator.clipboard.writeText(code).then(done, () => toast("Nusxalab bo'lmadi — kodni qo'lda belgilang", 'warn')); }
    catch(e){ toast("Nusxalab bo'lmadi — kodni qo'lda belgilang", 'warn'); }

  return html`<span className="code-chip"><span>${code}</span><button type="button" onClick=${copy} aria-label=${'Kodni nusxalash: ' + code} title="Nusxalash"><${Icon} n="copy" s=${14}/></button></span>`;

function Field({ label, hint, error, children, className }){

function Seg({ value, options, onChange, label }){

}
function Modal({ title, onClose, children, footer, wide }){
  useEffect(() => { const f = e => { if(e.key === 'Escape') onClose(); }; document.addEventListener('keydown', f); return () => document.removeEventListener('keydown', f); }, [onClose]);
  /* Portal: oyna kartochka ichida chaqirilsa ham butun ekranni qoplaydi (backdrop-filter konteyneri fixed'ni qisib qo'ymasin) */
  return ReactDOM.createPortal(html`<div className="modal-back" onMouseDown=${e => { if(e.target === e.currentTarget) onClose(); }}>
    <div className=${'modal' + (wide ? ' wide' : '')} role="dialog" aria-modal="true" aria-label=${title}>
      <header className="modal-head"><h3>${title}</h3><button className="icon-btn" onClick=${onClose} aria-label="Yopish"><${Icon} n="x"/></button></header>
      <div className="modal-body">${children}</div>
      ${footer ? html`<footer className="modal-foot">${footer}</footer>` : null}
    </div></div>`, document.body);
}
function Confirm({ title, text, okLabel, danger, onOk, onClose }){

}
/* Ro'yxatni sahifalash: resetKey o'zgarsa (filtr, tanlangan test) 1-sahifaga qaytadi */
function usePaged(list, per, resetKey){
  const [page, setPage] = useState(1);
  useEffect(() => { setPage(1); }, [resetKey]);
  const pages = Math.max(1, Math.ceil(list.length / per)), pg = Math.min(page, pages), offset = (pg - 1) * per;
  return { rows: list.slice(offset, offset + per), offset,
    pager: html`<${Pager} page=${pg} pages=${pages} total=${list.length} per=${per} onPage=${p => { setPage(p); window.scrollTo(0, 0); }}/>` };
}
function Pager({ page, pages, total, onPage, per }){
  per = per || 10;
  const from = total ? (page-1)*per + 1 : 0, to = Math.min(total, page*per);
  return html`<div className="pager"><span className="num">${from}–${to} / ${total} · ${page}/${pages}-sahifa</span><div className="actions">
    <button className="btn sm" disabled=${page <= 1} onClick=${() => onPage(page-1)}><${Icon} n="left" s=${14}/> Oldingi</button>
    ${Array.from({ length:pages }, (_,i) => i+1).map(n => html`<button key=${n} className=${'btn sm' + (n === page ? ' primary' : ' ghost')} aria-current=${n === page ? 'page' : undefined} onClick=${() => onPage(n)}>${n}</button>`)}
    <button className="btn sm" disabled=${page >= pages} onClick=${() => onPage(page+1)}>Keyingi <${Icon} n="right" s=${14}/></button></div></div>`;
}
function Tile({ icon, label, value, sub }){
  return html`<div className="card tile"><span className="tile-label"><${Icon} n=${icon} s=${15}/>${label}</span><span className="tile-value">${value}</span>${sub ? html`<span className="tile-sub">${sub}</span>` : null}</div>`;
}

/* ---------- components/charts ---------- */
function Bars({ data, suffix }){
  const max = Math.max(100, ...data.map(d => d.value));
  if(!data.length) return html`<${Empty} icon="chart" title="Ma'lumot yo'q"/>`;
  const dense = data.length > 12 ? ' dense' : '';
  return html`<div><div className=${'bars' + dense} role="img" aria-label=${data.map(d => `${d.label}: ${d.value}${suffix||''}`).join(', ')}>
    ${data.map(d => html`<div className="b" key=${d.label} title=${`${d.label}: ${d.display != null ? d.display : Math.round(d.value) + (suffix||'')}`}>${dense ? null : html`<span>${d.display != null ? d.display : Math.round(d.value) + (suffix||'')}</span>`}<i style=${{ height: (d.value/max*100) + '%', background: d.color || undefined }}></i></div>`)}
  </div><div className=${'bars-x' + dense}>${data.map(d => html`<span key=${d.label} title=${d.label}>${d.label}</span>`)}</div></div>`;
}
function LineChart({ points, labels }){
  if(points.length < 2) return html`<${Empty} icon="chart" title="Grafik uchun kamida 2 ta natija kerak"/>`;
  const W = 600, H = 180, max = 100;
  const xy = points.map((v,i) => [i/(points.length-1)*W, H - v/max*H]);
  const d = xy.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = xy[xy.length-1];
  return html`<div><div className="line-chart">
    <svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="lg-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="var(--accent)" stopOpacity=".32"/><stop offset="1" stopColor="var(--accent)" stopOpacity="0"/></linearGradient></defs>
      ${[0,25,50,75,100].map(g => html`<line key=${g} x1="0" x2=${W} y1=${H - g/100*H} y2=${H - g/100*H} stroke="var(--border)" strokeWidth="1" vectorEffect="non-scaling-stroke"/>`)}
      <path d=${d + ` L${W} ${H} L0 ${H} Z`} fill="url(#lg-area)"/>
      <path d=${d} fill="none" stroke="var(--accent)" strokeWidth="2.5" vectorEffect="non-scaling-stroke" strokeLinejoin="round"/>
    </svg>
    <span className="dot" style=${{ left: (last[0]/W*100) + '%', top: (last[1]/H*100) + '%' }}></span>
    <span className="dot-label num" style=${{ left: Math.min(94, last[0]/W*100) + '%', top: (last[1]/H*100) + '%' }}>${fmtPct(points[points.length-1])}</span>
  </div><div className="line-x"><span>${labels[0]}</span><span>${labels[labels.length-1]}</span></div></div>`;
}
function Donut({ parts, center, sub }){
  const total = parts.reduce((s,p) => s + p.value, 0) || 1;
  let off = 0;
  return html`<div className="donut-wrap"><div className="donut">
    <svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--surface-3)" strokeWidth="5"/>
      ${parts.map(p => { const len = p.value/total*100; const el = html`<circle key=${p.label} cx="21" cy="21" r="15.9155" fill="none" stroke=${p.color} strokeWidth="5" strokeDasharray=${`${len} ${100-len}`} strokeDashoffset=${-off}/>`; off += len; return el; })}
    </svg><div className="center"><div><b className="num">${center}</b><span>${sub}</span></div></div></div>
    <div className="legend">${parts.map(p => html`<div key=${p.label}><i style=${{ background:p.color }}></i>${p.label}<b>${p.value}</b></div>`)}</div></div>`;
}
function Ring({ value }){
  const tone = toneFor(value);
  const color = tone === 'ok' ? 'var(--ok)' : tone === 'warn' ? 'var(--warn)' : 'var(--bad)';
  return html`<div className="ring"><svg viewBox="0 0 42 42" aria-hidden="true"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--surface-3)" strokeWidth="4"/><circle cx="21" cy="21" r="15.9155" fill="none" stroke=${color} strokeWidth="4" strokeLinecap="round" strokeDasharray=${`${value} ${100-value}`}/></svg><div className="center"><div><b className="num">${fmtPct(value)}</b><span>natija</span></div></div></div>`;
}

    return { label:s.name, value: avg(at.map(a => a.percentage)), color:s.color, n:at.length };
  }).filter(x => x.n);
  const st = ['active','draft','completed'].map(s => ({ label:STATUS[s], value: db.tests.filter(t => t.status === s).length, color: s === 'active' ? 'var(--ok)' : s === 'draft' ? 'var(--faint)' : 'var(--accent)' }));

/* Login va parol generatori (admin foydalanuvchi qo'shganda) */
const CYR = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'yo',ж:'j',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'x',ц:'ts',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'i',ь:'',э:'e',ю:'yu',я:'ya',ў:'o',қ:'q',ғ:'g',ҳ:'h' };
const slug = s => String(s || '').toLowerCase().split('').map(c => CYR[c] != null ? CYR[c] : c).join('').replace(/[^a-z0-9]/g, '');
const genPassword = () => Array.from({ length:8 }, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
function makeUsername(first, last, taken){
  const base = (slug(first) + (slug(last)[0] || '')) || 'user';
  let u = base, k = 1;
  while(taken.has(u)) u = base + (++k);
  taken.add(u); return u;
}

function BulkAddModal({ onClose, initialMode }){
  const { db, mutate } = useApp();

  const [rows, setRows] = useState(null); const [err, setErr] = useState(''); const [done, setDone] = useState(null); const [fname, setFname] = useState('');
  const fileRef = useRef(null);
  const ROLE_IN = v => { v = slug(v); return /teach|oqit|ustoz|uchit/.test(v) ? 'teacher' : /admin/.test(v) ? 'admin' : /stud|oquv|uchen/.test(v) ? 'student' : null; };
  const build = raw => {
    const taken = new Set(db.users.map(u => u.username.toLowerCase()));
    return raw.map(c => c.map(x => String(x == null ? '' : x).trim())).filter(c => c.some(Boolean)).map((c, i) => {
      let [first, last, phone, email, login, pass, r] = c;
      if(first && !last && first.includes(' ')){ const p = first.split(/\s+/); first = p[0]; last = p.slice(1).join(' '); }
      const problems = [];
      if(!first || !last) problems.push('ism va familiya kerak');
      let username = login ? login.toLowerCase() : '';
      if(username){ if(!/^[a-z0-9_.]{3,}$/.test(username)) problems.push("login noto'g'ri"); else if(taken.has(username)) problems.push('login band'); else taken.add(username); }
      else if(first && last) username = makeUsername(first, last, taken);
      if(email && !/^\S+@\S+\.\S+$/.test(email)) problems.push("email noto'g'ri");
      if(pass && pass.length < 6) problems.push('parol 6 belgidan qisqa');
      return { n:i+1, problem: problems.join(', '), u:{ id:nid(), username, password: pass || genPassword(), email: email || '', first_name:first || '', last_name:last || '', role: ROLE_IN(r) || role, phone: phone || '', avatar:null, created_at:new Date().toISOString() } };
    });
  };
  const parseText = () => { setErr(''); const lines = text.split(/\r?\n/).filter(l => l.trim()); if(!lines.length) return setErr("Kamida bitta qator yozing"); setRows(build(lines.map(l => l.split(/\t|;|,/)))); };

      return rd.readAsArrayBuffer(file);

    rd.onload = () => { try{ const wb = XLSX.read(new Uint8Array(rd.result), { type:'array' }); let data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:'' });
      if(data[0] && /ism|name|имя/i.test(String(data[0][0]))) data = data.slice(1); setRows(build(data)); }catch(ex){ setErr("Faylni o'qib bo'lmadi. .xlsx yoki .csv jadval yuklang."); } };

    ${rows ? html`
      <b className="small">${rows.length} ta qator: ${good.length} tasi tayyor${rows.length - good.length ? `, ${rows.length - good.length} tasida xato (ular qo'shilmaydi)` : ''}</b>
      <div className="card table-wrap" style=${{ maxHeight:340, overflow:'auto' }}><table className="tbl compact"><thead><tr><th>#</th><th>F.I.Sh.</th><th>Rol</th><th>Login</th><th>Telefon</th><th>Holat</th></tr></thead>
        <tbody>${rows.map(r => html`<tr key=${r.n}><td className="faint">${r.n}</td><td>${r.u.first_name} ${r.u.last_name}</td><td>${ROLE[r.u.role]}</td><td className="mono">${r.u.username || '—'}</td><td>${r.u.phone || '—'}</td><td>${r.problem ? html`<${Pill} tone="bad" plain>${r.problem}<//>` : html`<${Pill} tone="ok" plain>tayyor<//>`}</td></tr>`)}</tbody></table></div>`
    : html`

function QuestionModal({ initial, onSave, onClose, freePoints }){
  const blank = { question_type:'single', text:'', image:null, difficulty:'medium', points:1, choices:[{ id:nid(), text:'', is_correct:true },{ id:nid(), text:'', is_correct:false },{ id:nid(), text:'', is_correct:false },{ id:nid(), text:'', is_correct:false }] };
  const [q, setQ] = useState(() => initial ? JSON.parse(JSON.stringify(initial)) : blank);
  const [err, setErr] = useState('');
  const fileRef = useRef(null);
  const upd = patch => { setQ(Object.assign({}, q, patch)); setErr(''); };
  const setType = t => {
    if(t === q.question_type) return;
    if(t === 'written') upd({ question_type:t, choices:[], answers: q.answers && q.answers.length ? q.answers : [''], points: Math.max(+q.points || 1, 2) });
    else if(q.question_type === 'written') upd({ question_type:t, choices: t === 'true_false' ? [{ id:nid(), text:'Rost', is_correct:true },{ id:nid(), text:"Yolg'on", is_correct:false }] : blank.choices });
    else if(t === 'true_false') upd({ question_type:t, choices:[{ id:nid(), text:'Rost', is_correct:true },{ id:nid(), text:"Yolg'on", is_correct:false }] });
    else if(q.question_type === 'true_false') upd({ question_type:t, choices:blank.choices });
    else { let found = false; upd({ question_type:t, choices: t === 'single' ? q.choices.map(c => { const keep = c.is_correct && !found; if(keep) found = true; return Object.assign({}, c, { is_correct:keep }); }) : q.choices }); }
  };
  const setChoice = (i, patch) => upd({ choices: q.choices.map((c,j) => j === i ? Object.assign({}, c, patch) : c) });
  const mark = i => {
    if(q.question_type === 'multiple') setChoice(i, { is_correct: !q.choices[i].is_correct });
    else upd({ choices: q.choices.map((c,j) => Object.assign({}, c, { is_correct: j === i })) });
  };
  const onImage = e => {
    const file = e.target.files && e.target.files[0]; if(!file) return;
    if(!file.type.startsWith('image/')){ setErr('Faqat rasm fayli (PNG, JPG, GIF) yuklang'); return; }
    if(file.size > 600*1024){ setErr(`Rasm hajmi ${Math.round(file.size/1024)} KB — prototipda 600 KB gacha ruxsat`); return; }
    const rd = new FileReader(); rd.onload = () => upd({ image: rd.result }); rd.readAsDataURL(file);
  };
  const save = () => {
    if(!q.text.trim()) return setErr('Savol matnini kiriting');
    if(isWritten(q)){
      const acc = (q.answers || []).map(s => s.trim()).filter(Boolean);
      if(!acc.length) return setErr("Kamida bitta to'g'ri javobni yozing");
      if(!(+q.points > 0)) return setErr("Ball 0 dan katta bo'lishi kerak");
      onSave(Object.assign({}, q, { id: q.id || nid(), text:q.text.trim(), points:+q.points, choices:[], answers:acc })); onClose(); return;
    }
    if(q.choices.some(c => !c.text.trim())) return setErr("Bo'sh variantlarni to'ldiring yoki o'chiring");
    if(!q.choices.some(c => c.is_correct)) return setErr("Kamida bitta to'g'ri javobni belgilang");
    if(!(+q.points > 0)) return setErr("Ball 0 dan katta bo'lishi kerak");
    onSave(Object.assign({}, q, { id: q.id || nid(), text:q.text.trim(), points:+q.points })); onClose();
  };
  const multi = q.question_type === 'multiple';
  return html`<${Modal} wide title=${initial ? 'Savolni tahrirlash' : "Yangi savol"} onClose=${onClose} footer=${html`${err ? html`<span className="field-err" style=${{ marginRight:'auto', alignSelf:'center' }}>${err}</span>` : null}<button className="btn ghost" onClick=${onClose}>Bekor qilish</button><button className="btn primary" onClick=${save}>Savolni saqlash</button>`}>
    <div className="actions" style=${{ justifyContent:'space-between' }}>
      <${Seg} label="Savol turi" value=${q.question_type} onChange=${setType} options=${Object.entries(QTYPE)}/>
      <div className="actions">
        <select id="qm-diff" className="select" style=${{ width:'auto' }} value=${q.difficulty} onChange=${e => upd({ difficulty:e.target.value })} aria-label="Qiyinlik">${Object.entries(DIFF).map(([k,v]) => html`<option key=${k} value=${k}>${v}</option>`)}</select>
        ${freePoints ? html`<label className="actions small muted" htmlFor="qm-pts">Ball <input id="qm-pts" className="input num" type="number" min="0.1" max="100" step="0.1" style=${{ width:80 }} value=${q.points} onChange=${e => upd({ points: e.target.value === '' ? '' : +e.target.value })}/></label>`
        : html`<span className="small muted" title="1–10-savollar 1,2 ball, 11–20-savollar 1,8 ball, 21–30-savollar 2 ball">Ball o'rniga qarab avtomatik</span>`}
      </div>
    </div>
    <${Field} label="Savol matni" hint="Formula uchun $ belgisi ichida LaTeX yozing: $x^2 + \\frac{1}{2}$, $\\sqrt{a}$, $\\sin\\alpha$"><textarea id="qm-text" className="textarea" value=${q.text} onChange=${e => upd({ text:e.target.value })} placeholder="masalan, $x^2 - 9 = 0$ tenglamaning ildizlarini toping"></textarea><//>
    ${q.text.includes('$') ? html`<div className="preview-box"><div className="small faint" style=${{ marginBottom:4 }}>Ko'rinishi</div><${MathText} text=${q.text}/></div>` : null}
    <div className="field"><span className="field-label">Rasm (ixtiyoriy)</span>
      ${q.image ? html`<div className="actions" style=${{ alignItems:'flex-start' }}><img className="q-img" src=${q.image} alt="Savol rasmi"/><button className="btn sm danger" onClick=${() => upd({ image:null })}><${Icon} n="trash" s=${14}/> Olib tashlash</button></div>`
      : html`<button type="button" className="drop" onClick=${() => fileRef.current && fileRef.current.click()}><${Icon} n="image" s=${24}/><span>Rasm tanlash — PNG, JPG, 600 KB gacha</span></button>`}
      <input ref=${fileRef} type="file" accept="image/*" hidden onChange=${onImage}/></div>
    ${isWritten(q) ? html`<div className="field"><span className="field-label">To'g'ri javob(lar) — o'quvchi yozgan javob shulardan biriga mos kelsa, ball beriladi</span>
      <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>${(q.answers || []).map((s,i) => html`<div key=${i} className="choice-row">
        <span className="q-num" style=${{ width:26, height:26, fontSize:'.78rem', background:'var(--ok-soft)', color:'var(--ok)' }}><${Icon} n="check" s=${14}/></span>
        <input id=${'qm-a-' + i} className="input" value=${s} onChange=${e => upd({ answers: q.answers.map((x,j) => j === i ? e.target.value : x) })} placeholder=${i ? 'Muqobil yozilishi (ixtiyoriy)' : "To'g'ri javob, masalan 36"}/>
        <button className="icon-btn danger" disabled=${q.answers.length <= 1} onClick=${() => upd({ answers: q.answers.filter((_,j) => j !== i) })} aria-label="Javobni o'chirish"><${Icon} n="x" s=${16}/></button></div>`)}</div>
      ${(q.answers || []).length < 5 ? html`<button className="btn sm ghost" style=${{ alignSelf:'flex-start' }} onClick=${() => upd({ answers: (q.answers || []).concat('') })}><${Icon} n="plus" s=${14}/> Muqobil javob qo'shish</button>` : null}
      <span className="field-hint">Katta-kichik harf, ortiqcha bo'shliq, ё/е va 3,5 / 3.5 farqi hisobga olinmaydi.</span></div>` : html`
    <div className="field"><span className="field-label">${q.question_type === 'true_false' ? "To'g'ri javobni belgilang" : multi ? "Variantlar — bir nechta to'g'ri javobni belgilash mumkin" : "Variantlar — bitta to'g'ri javobni belgilang"}</span>
      <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>${q.choices.map((c,i) => html`<div key=${c.id} className="choice-row">
        <input className="mark" type=${multi ? 'checkbox' : 'radio'} name="qm-correct" checked=${c.is_correct} onChange=${() => mark(i)} aria-label=${`${LETTERS[i]} variant to'g'ri`}/>
        <span className="q-num" style=${{ width:26, height:26, fontSize:'.78rem' }}>${LETTERS[i]}</span>
        <input id=${'qm-c-' + i} className="input" value=${c.text} disabled=${q.question_type === 'true_false'} onChange=${e => setChoice(i, { text:e.target.value })} placeholder=${`${LETTERS[i]} variant`}/>
        ${c.text.includes('$') ? html`<span className="small" style=${{ minWidth:60 }}><${MathText} text=${c.text}/></span>` : null}
        ${q.question_type !== 'true_false' ? html`<button className="icon-btn danger" disabled=${q.choices.length <= 2} onClick=${() => upd({ choices: q.choices.filter((_,j) => j !== i) })} aria-label=${LETTERS[i] + " variantni o'chirish"}><${Icon} n="x" s=${16}/></button>` : null}
      </div>`)}</div>
      ${q.question_type !== 'true_false' && q.choices.length < 6 ? html`<button className="btn sm ghost" style=${{ alignSelf:'flex-start' }} onClick=${() => upd({ choices: q.choices.concat({ id:nid(), text:'', is_correct:false }) })}><${Icon} n="plus" s=${14}/> Variant qo'shish</button>` : null}
    </div>`}<//>`;
}

  const { db, user } = useApp();
  const banks = db.banks.filter(b => b.created_by === user.id || user.role === 'admin');
  const [bank, setBank] = useState(() => { const b = banks.find(x => x.subject_id === subjectId) || banks[0]; return b ? b.id : null; });
  const [sel, setSel] = useState([]);
  const qs = db.questions.filter(q => q.bank_id === bank);
  const toggle = id => setSel(sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id));
  return html`<${Modal} wide title="Savol bankidan qo'shish" onClose=${onClose} footer=${html`<button className="btn ghost" onClick=${onClose}>Bekor qilish</button><button className="btn primary" disabled=${!sel.length} onClick=${() => { onAdd(db.questions.filter(q => sel.includes(q.id))); onClose(); }}>${sel.length} ta savolni qo'shish</button>`}>
    ${banks.length ? html`<${Field} label="Bank"><select id="bp-bank" className="select" value=${bank || ''} onChange=${e => { setBank(+e.target.value); setSel([]); }}>${banks.map(b => html`<option key=${b.id} value=${b.id}>${b.name} — ${(db.subjects.find(s => s.id === b.subject_id) || {}).name || ''} (${db.questions.filter(q => q.bank_id === b.id).length})</option>`)}</select><//>
      <div style=${{ display:'flex', flexDirection:'column', gap:8 }}>${qs.map(q => html`<label key=${q.id} className=${'pick-row' + (sel.includes(q.id) ? ' on' : '')}><input type="checkbox" checked=${sel.includes(q.id)} onChange=${() => toggle(q.id)}/><div style=${{ minWidth:0 }}><div><${MathText} text=${q.text}/></div><div className="small muted">${QTYPE[q.question_type]} · ${fmtNum(q.points)} ball · ${DIFF[q.difficulty]}</div></div></label>`)}
      ${!qs.length ? html`<${Empty} icon="layers" title="Bu bank bo'sh"/>` : null}</div>`
    : html`<${Empty} icon="layers" title="Sizda hali savol banki yo'q">"Savol banki" bo'limida bank yarating.<//>`}<//>`;
}
